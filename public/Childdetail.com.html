<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Child details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body data-page="details" style="display:flex; margin:0; background-color:#F8F4EB; font-family:Inter, Arial, sans-serif;">
<aside style="width:220px; min-height:100vh; flex-shrink:0; background-color:#E4EDDA; display:flex; flex-direction:column; box-sizing:border-box; padding-bottom:28px;">

  <p style="margin:26px 0 0 24px; font-size:23px; line-height:28px; font-weight:bold; color:#284D36;">Sprout House</p>
  <p style="margin:8px 0 36px 24px; font-size:11px; line-height:13px; font-weight:bold; color:#54645A;">NURSERY STAFF PORTAL</p>

  <button type="button" onclick="location.href='Registry.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:#284D36; color:white;">Children</button>

  <button type="button" onclick="location.href='Statistics.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">Statistics</button>

  <button type="button" data-admin-only onclick="location.href='Accounts&Roles.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">Accounts &amp; Roles</button>

  <button type="button" onclick="location.href='AbouttheAuthor.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">About the Author</button>

  <p id="current-role" style="margin:auto 0 10px 24px; font-size:14px; line-height:18px; font-weight:bold; color:#54645A;">Administrator</p>
  <button id="signout" type="button" style="width:172px; margin-left:24px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#284D36;">Sign out</button>

</aside>

<section style="width:922px; margin:29px 0 29px 28px; flex-shrink:0;">

  <div style="position:relative; height:114px; background-color:#E4EDDA; border-radius:16px; padding:17px 23px; box-sizing:border-box;">
    <h1 id="child-heading" style="margin:0; font-size:34px; line-height:44px; color:#284D36;">Amelia Green</h1>
    <p id="child-subtitle" style="margin:5px 0 0; font-size:15px; line-height:20px; color:#54645A;">Child record · Enrolled</p>
    <img src="Teddy.png" alt="Teddy bear" style="position:absolute; left:810px; top:19px; width:84px; height:72px;">
  </div>

  <div id="page-message" style="display:none; margin-top:17px; padding:14px 19px; border-radius:10px; background-color:#F7E5DC; color:#54645A; font-size:16px; line-height:20px;"></div>

  <div style="margin-top:21px; height:424px; padding:22px 29px 0 24px; box-sizing:border-box; background-color:#FFFDF9; border-radius:12px;">

    <h2 style="margin:0; font-size:24px; line-height:29px; color:#284D36;">Child and guardian details</h2>

    <div style="display:grid; grid-template-columns:445px 424px; margin-top:23px;">

      <div style="height:78px;">
        <p style="margin:0; font-size:13px; line-height:16px; font-weight:bold; color:#54645A;">Full name</p>
        <p id="full-name" style="margin:5px 0 0; font-size:18px; line-height:22px; color:#284D36;"></p>
      </div>

      <div style="height:78px;">
        <p style="margin:0; font-size:13px; line-height:16px; font-weight:bold; color:#54645A;">Birth date</p>
        <p id="birth-date" style="margin:5px 0 0; font-size:18px; line-height:22px; color:#284D36;"></p>
      </div>

      <div style="height:78px;">
        <p style="margin:0; font-size:13px; line-height:16px; font-weight:bold; color:#54645A;">Group</p>
        <p id="group-name" style="margin:5px 0 0; font-size:18px; line-height:22px; color:#284D36;"></p>
      </div>

      <div style="height:78px;">
        <p style="margin:0; font-size:13px; line-height:16px; font-weight:bold; color:#54645A;">Status</p>
        <p id="child-status" style="margin:5px 0 0; font-size:18px; line-height:22px; color:#284D36;"></p>
      </div>

      <div style="height:78px;">
        <p style="margin:0; font-size:13px; line-height:16px; font-weight:bold; color:#54645A;">Guardian name</p>
        <p id="guardian-name" style="margin:5px 0 0; font-size:18px; line-height:22px; color:#284D36;"></p>
      </div>

      <div style="height:78px;">
        <p style="margin:0; font-size:13px; line-height:16px; font-weight:bold; color:#54645A;">Guardian email</p>
        <p id="guardian-email" style="margin:5px 0 0; font-size:18px; line-height:22px; color:#284D36;"></p>
      </div>

    </div>

    <div style="display:flex; align-items:center; gap:16px; margin-top:26px;">
      <button type="button" onclick="location.href='Registry.html'" style="width:163px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#284D36;">Back to registry</button>
      <button id="edit-child" type="button" data-admin-only style="width:130px; margin-left:auto; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#284D36;">Edit child</button>
      <button id="delete-child" type="button" data-admin-only style="width:151px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#9A3439;">Delete child</button>
    </div>

  </div>

</section>

</body>
</html>
