<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit child</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body data-page="edit" data-access="admin" style="display:flex; margin:0; background-color:#F8F4EB; font-family:Inter, Arial, sans-serif;">
<aside style="width:220px; min-height:100vh; flex-shrink:0; background-color:#E4EDDA; display:flex; flex-direction:column; box-sizing:border-box; padding-bottom:28px;">

  <p style="margin:26px 0 0 24px; font-size:23px; line-height:28px; font-weight:bold; color:#284D36;">Sprout House</p>
  <p style="margin:8px 0 36px 24px; font-size:11px; line-height:13px; font-weight:bold; color:#54645A;">NURSERY STAFF PORTAL</p>

  <button type="button" onclick="location.href='Registry.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:#284D36; color:white;">Children</button>

  <button type="button" onclick="location.href='Statistics.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">Statistics</button>

  <button type="button" data-admin-only onclick="location.href='Accounts&Roles.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">Accounts &amp; Roles</button>

  <button type="button" onclick="location.href='AbouttheAuthor.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">About the Author</button>

  <p id="current-role" style="margin:auto 0 10px 24px; font-size:14px; line-height:18px; font-weight:bold; color:#54645A;">Administrator</p>
  <button id="signout" type="button" style="width:172px; margin-left:24px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#284D36;">Sign out</button>

</aside>

<section style="width:922px; margin:29px 0 29px 28px; flex-shrink:0;">

  <div style="position:relative; height:114px; background-color:#E4EDDA; border-radius:16px; padding:17px 23px; box-sizing:border-box;">
    <h1 style="margin:0; font-size:34px; line-height:44px; color:#284D36;">Edit child</h1>
    <p id="edit-subtitle" style="margin:5px 0 0; font-size:15px; line-height:20px; color:#54645A;">Update Amelia Green's record.</p>
    <img src="Teddy.png" alt="Teddy bear" style="position:absolute; left:810px; top:19px; width:84px; height:72px;">
  </div>

  <div id="page-message" style="display:none; margin-top:17px; padding:14px 19px; border-radius:10px; background-color:#F7E5DC; color:#54645A; font-size:16px; line-height:20px;"></div>

  <form id="child-form" method="post" data-admin-only style="margin-top:21px; height:430px; padding:29px 25px 0 24px; box-sizing:border-box; background-color:#FFFDF9; border-radius:12px;">

    <div style="display:grid; grid-template-columns:424px 424px; column-gap:25px; row-gap:24px;">

      <div>
        <label for="fullname" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Full name *</label>
        <input type="text" id="fullname" name="fullName" required placeholder="Enter full name" style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A;">
      </div>

      <div>
        <label for="birthdate" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Birth date *</label>
        <input type="date" id="birthdate" name="birthdate" required style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A;">
      </div>

      <div>
        <label for="group" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Group *</label>
        <select id="group" name="groupId" required style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A; appearance:none; -webkit-appearance:none;">
          <option value="" disabled selected>Select a group ▾</option>
          <option value="1">Acorns ▾</option>
          <option value="2">Sunflowers ▾</option>
        </select>
      </div>

      <div>
        <label for="status" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Enrolment status *</label>
        <select id="status" name="status" required style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A; appearance:none; -webkit-appearance:none;">
          <option value="" disabled selected>Select a status ▾</option>
          <option value="Enrolled">Enrolled ▾</option>
          <option value="Waitlisted">Waitlisted ▾</option>
        </select>
      </div>

      <div>
        <label for="guardian" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Guardian name *</label>
        <input type="text" id="guardian" name="guardianName" required placeholder="Enter guardian name" style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A;">
      </div>

      <div>
        <label for="guardian-email" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Guardian email *</label>
        <input type="email" id="guardian-email" name="guardianEmail" required placeholder="name@example.com" style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A;">
      </div>

    </div>

    <p style="margin:39px 0 0; font-size:14px; line-height:18px; color:#54645A;">* Required fields</p>

    <div style="display:flex; justify-content:flex-end; gap:18px; margin-top:30px;">
      <button id="cancel-child-form" type="button" onclick="location.href='Registry.html'" style="width:122px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#536C54;">Cancel</button>
      <button type="submit" style="width:203px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#284D36;">Save changes</button>
    </div>

  </form>

</section>

</body>
</html>
