<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Children Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body data-page="registry" style="display:flex; margin:0; background-color:#F8F4EB; font-family:Inter, Arial, sans-serif;">
<aside style="width:220px; min-height:100vh; flex-shrink:0; background-color:#E4EDDA; display:flex; flex-direction:column; box-sizing:border-box; padding-bottom:28px;">

  <p style="margin:26px 0 0 24px; font-size:23px; line-height:28px; font-weight:bold; color:#284D36;">Sprout House</p>
  <p style="margin:8px 0 36px 24px; font-size:11px; line-height:13px; font-weight:bold; color:#54645A;">NURSERY STAFF PORTAL</p>

  <button type="button" onclick="location.href='Registry.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:#284D36; color:white;">Children</button>

  <button type="button" onclick="location.href='Statistics.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">Statistics</button>

  <button type="button" data-admin-only onclick="location.href='Accounts&Roles.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">Accounts &amp; Roles</button>

  <button type="button" onclick="location.href='AbouttheAuthor.html'" style="width:190px; height:42px; margin:0 0 9px 15px; padding:0 0 0 12px; text-align:left; border:none; border-radius:6px; font-family:Inter, Arial, sans-serif; font-size:16px; font-weight:bold; cursor:pointer; background-color:transparent; color:#284D36;">About the Author</button>

  <p id="current-role" style="margin:auto 0 10px 24px; font-size:14px; line-height:18px; font-weight:bold; color:#54645A;">Administrator</p>
  <button id="signout" type="button" style="width:172px; margin-left:24px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#284D36;">Sign out</button>

</aside>

<section style="width:922px; margin:29px 0 29px 28px; flex-shrink:0;">

  <div style="position:relative; height:114px; background-color:#E4EDDA; border-radius:16px; padding:17px 23px; box-sizing:border-box;">
    <h1 style="margin:0; font-size:34px; line-height:44px; color:#284D36;">Children Registry</h1>
    <p data-educator-text="Browse nursery records and guardian details." style="margin:5px 0 0; font-size:15px; line-height:20px; color:#54645A;">Manage nursery enrolment and guardian details.</p>
    <button id="add-child" type="button" data-admin-only onclick="location.href='AddChild.html'" style="position:absolute; left:627px; top:36px; width:154px; height:42px; border:none; border-radius:6px; color:white; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:bold; cursor:pointer; background-color:#284D36;">+ Add child</button>
    <img src="Teddy.png" alt="Teddy bear" style="position:absolute; left:810px; top:19px; width:84px; height:72px;">
  </div>

  <div id="page-message" style="display:none; margin-top:17px; padding:14px 19px; border-radius:10px; background-color:#F7E5DC; color:#54645A; font-size:16px; line-height:20px;"></div>

  <div style="margin-top:21px; min-height:472px; padding:20px 0 0; box-sizing:border-box; background-color:#FFFDF9; border-radius:12px;">

    <div style="display:flex; gap:20px; padding:0 25px 0 19px;">
      <div style="width:365px;">
        <label for="registry-search" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Search children</label>
        <input id="registry-search" type="search" placeholder="Search by child or guardian" style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A;">
      </div>
      <div style="width:202px;">
        <label for="registry-group" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Group</label>
        <select id="registry-group" style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A; appearance:none; -webkit-appearance:none;">
          <option value="all">All groups ▾</option>
          <option value="1">Acorns ▾</option>
          <option value="2">Sunflowers ▾</option>
        </select>
      </div>
      <div style="width:271px;">
        <label for="registry-sort" style="display:block; margin:0 0 5px; font-size:14px; line-height:18px; font-weight:bold; color:#284D36;">Sort by</label>
        <select id="registry-sort" style="width:100%; height:42px; background-color:#F8F4EB; border:none; border-radius:6px; padding:0 12px; box-sizing:border-box; font-family:Inter, Arial, sans-serif; font-size:14px; color:#54645A; appearance:none; -webkit-appearance:none;">
          <option value="name">Name (A-Z) ▾</option>
          <option value="birthdate">Birth date ▾</option>
        </select>
      </div>
    </div>

    <table style="width:100%; margin-top:23px; border-collapse:collapse; table-layout:fixed; font-size:15px;">
      <thead>
        <tr style="height:39px; background-color:#E4EDDA;">
          <th style="width:193px; padding:0; font-size:14px; font-weight:bold; text-align:left; color:#284D36; padding-left:18px;">Child</th>
          <th style="width:137px; padding:0; font-size:14px; font-weight:bold; text-align:left; color:#284D36;">Birth date</th>
          <th style="width:145px; padding:0; font-size:14px; font-weight:bold; text-align:left; color:#284D36;">Group</th>
          <th style="width:172px; padding:0; font-size:14px; font-weight:bold; text-align:left; color:#284D36;">Guardian</th>
          <th style="width:140px; padding:0; font-size:14px; font-weight:bold; text-align:left; color:#284D36;">Status</th>
          <th style="padding:0; font-size:14px; font-weight:bold; text-align:left; color:#284D36;">Actions</th>
        </tr>
      </thead>
      <tbody id="registry-rows"></tbody>
    </table>

    <p id="registry-count" style="margin:29px 0 0 18px; padding-bottom:24px; font-size:14px; line-height:18px; color:#54645A;"></p>

  </div>

</section>

</body>
</html>
