
<!DOCTYPE html>
<html>
<head>
	<title>Page Title</title>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="../style.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="script.js" defer></script>
</head>
<body style="background-color: #F8F4EB;display: flex;">
<aside style="width:455px;height: 658px;margin-left: 36px;margin-top:36px ;border-radius: 20px;background-color: #E4EDDA;">
	<img src="Teddy.png" alt="No-pic" style="width:84px;height: 72px;margin-left: 184px; margin-top: 172px;">
	<p style="color:forestgreen;width:267px; height:48px; margin-left:122px; margin-top:20px;font-family: inter; font-size: 40px; font-weight:bold;">Sprout house</p>
	<p style="color:forestgreen;width:167px;height:22px;margin-left:142px;margin-top:8px;font-size:18px; font-family:inter">Nursery staff portal</p>
</aside>
<section style="width: 606px;height: 588px;background-color: #FFFDF9;margin-top: 71px;margin-left: -150px;border-radius: 18px;">
	<form>

		<p style="margin-left:36px; margin-top:31px; margin-bottom:0; width:534px; height:42px; font-family:Inter,sans-serif; font-weight:700; font-size:35px; line-height:normal; text-align:left;">Sign in</p>

		<p style="margin-left:36px; margin-top:10px; margin-bottom:0; width:534px; height:19px; font-family:Inter,sans-serif; font-size:14px; color:#54645A;">Welcome to your nursery workspace</p>

		<label for="email" style="color:forestgreen; margin-top:35px; margin-left:36px; display:block; font-family:Inter,sans-serif; font-weight:bold; font-size:14px;">Email</label>

		<input id="email" type="email" placeholder="name@example.com" style="height:42px; width:534px; margin-left:36px; margin-top:12px; color:#54645A; box-sizing:border-box; padding-left:12px;">

		<label for="password" style="color:forestgreen; margin-top:22px; margin-left:36px; display:block; font-family:Inter,sans-serif; font-weight:bold; font-size:14px;">Password</label>

		<input id="password" type="password" placeholder="Enter your password" style="height:42px; width:534px; margin-left:36px; margin-top:12px; color:#54645A; box-sizing:border-box; padding-left:12px;">

		<button type="submit" onclick="location.href='Register.html'" style="background-color:forestgreen; margin-left:36px; margin-top:36px; width:534px; height:42px; color:white; border:none; border-radius:6px; cursor:pointer;">Sign in</button>

		<p style="margin-left:36px; margin-top:22px; width:534px; text-align:center; font-family:Inter,sans-serif; font-size:14px; color:#54645A;">
			New member?
			<button type="button" onclick="location.href='Register.html'" style="color:forestgreen; font-weight:bold;"> New staff member? Create an account</button>
		</p>

	</form>
</section>

</body>
</html>
